# Builds an installable test APK with the bundled arm64 runtime, so a change can
# be tried on a real phone without a local Android toolchain:
#
#   Actions > Test APK > Run workflow   (or push a change to this file)
#   then download the `dsh-go-test-apk` artifact of that run.
#
# Uses the official package name and the fork owner's fixed signing key.
# Uninstall an official-signed installation before switching to this fork.
# Later fork builds signed with the same key can update it in place.
# Not part of `CI OK`: this is a delivery build, not a check.
name: Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-apk.yml'
      - 'app/**'
      - 'packages/**'
      - 'runtime/**'
      - 'tooling/**'

permissions:
  contents: read

concurrency:
  group: test-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  GRADLE_VERSION: 9.3.1
  TZ: Asia/Shanghai

jobs:
  apk:
    name: Test APK (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prepare the fixed fork signing key
        env:
          FORK_ANDROID_KEYSTORE_BASE64: ${{ secrets.FORK_ANDROID_KEYSTORE_BASE64 }}
          FORK_ANDROID_STORE_PASSWORD: ${{ secrets.FORK_ANDROID_STORE_PASSWORD }}
          FORK_ANDROID_KEY_ALIAS: ${{ secrets.FORK_ANDROID_KEY_ALIAS }}
          FORK_ANDROID_KEY_PASSWORD: ${{ secrets.FORK_ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('KEYSTORE_BASE64', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          missing = [name for name in names if not os.environ.get('FORK_ANDROID_' + name)]
          if missing:
              raise SystemExit('Missing signing secrets: ' + ', '.join(missing))
          key = Path(os.environ['RUNNER_TEMP']) / 'dsh-go-fork.jks'
          key.write_bytes(base64.b64decode(os.environ['FORK_ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r').replace(' ', '\\ ')
          properties = {
              'storeFile': key.as_posix(),
              'storePassword': os.environ['FORK_ANDROID_STORE_PASSWORD'],
              'keyAlias': os.environ['FORK_ANDROID_KEY_ALIAS'],
              'keyPassword': os.environ['FORK_ANDROID_KEY_PASSWORD'],
          }
          config = Path('app/android/key.properties')
          config.write_text(''.join(name + '=' + escape(value) + '\n' for name, value in properties.items()), encoding='ascii')
          config.chmod(0o600)
          PY
      # Same runtime the release path bundles; the download cache is verified by
      # hash on every run, so a stale entry is harmless.
      - name: Restore the runtime download cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: runtime-downloads-v1-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: runtime-downloads-v1-
      - name: Build the arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a
      - name: Check the runtime bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64
      - name: Save the runtime download cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/.cache
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      # libtawcroot.so is a release-build input compiled from this exact NDK
      # (runtime/tawcroot/source.json); the runner image ships no NDK at all.
      - name: Install the pinned Android NDK
        run: |
          sdkmanager="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager" ]; then
            sdkmanager="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort | head -n 1)"
          fi
          [ -n "$sdkmanager" ] || { echo "no sdkmanager found" >&2; exit 1; }
          yes | "$sdkmanager" --licenses > /dev/null 2>&1 || true
          "$sdkmanager" --install "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter plugins and local.properties
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Build the test APK
        run: tooling/build-apk.sh --release -f arm64 --no-companion --no-star
      - name: Verify the APK signing certificate
        env:
          FORK_ANDROID_STORE_PASSWORD: ${{ secrets.FORK_ANDROID_STORE_PASSWORD }}
          FORK_ANDROID_KEY_ALIAS: ${{ secrets.FORK_ANDROID_KEY_ALIAS }}
        run: |
          keytool -exportcert -keystore "$RUNNER_TEMP/dsh-go-fork.jks" \
            -storepass:env FORK_ANDROID_STORE_PASSWORD -alias "$FORK_ANDROID_KEY_ALIAS" \
            -file "$RUNNER_TEMP/dsh-go-fork.der"
          expected="$(sha256sum "$RUNNER_TEMP/dsh-go-fork.der" | cut -d ' ' -f 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          for apk in app/build/app/outputs/flutter-apk/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apk-cert.txt"
            # Build Tools 36 uses "Signer #1"; 37 uses "V3.0 Signer:".
            # All reported signing certificates must match the fixed fork key.
            actual="$(sed -nE 's/^(Signer #[0-9]+|V[0-9.]+ Signer:) certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\2/p' "$RUNNER_TEMP/apk-cert.txt" | tr '[:upper:]' '[:lower:]' | sort -u)"
            [ "$actual" = "$expected" ] || { cat "$RUNNER_TEMP/apk-cert.txt"; echo "APK signing certificate mismatch: expected $expected, got ${actual:-<not found>}" >&2; exit 1; }
            echo "Verified fork signing certificate: $actual"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dsh-go-test-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error
      - name: Remove signing files from the runner
        if: always()
        run: rm -f app/android/key.properties "$RUNNER_TEMP/dsh-go-fork.jks" "$RUNNER_TEMP/dsh-go-fork.der"
